# Mosquitto broker for the Smart Traffic Management System
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT for sensors, Node-RED and backend (inside the docker network)
listener 1883
protocol mqtt

# MQTT over WebSockets (optional, for browser clients / debugging)
listener 9001
protocol websockets

# Demo setup: anonymous access. For production, set
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
#   acl_file /mosquitto/config/acl
allow_anonymous true
